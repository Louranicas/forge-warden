#:schema ./schemas/policy.v0.schema.json
# forge-warden judges its own pull requests with this policy (.github/workflows/ci.yml, job
# `dogfood`). It is the starter policy tightened for a Rust crate whose core must stay pure.
schema = "forge-warden.policy.v0"

# The ranker `check --ranker` may run (authority mode): the released deep-diff-forge v0.8.2
# binary for x86_64-unknown-linux-gnu, pinned by its bytes. It is the `deep-diff-forge` file inside
# deep-diff-forge-v0.8.2-x86_64-unknown-linux-gnu.tar.gz (archive sha256 in
# scripts/tool-versions.toml), built from tag commit fb5ffe15ae582f665d9de073d5231ecff8003a17.
# A binary built from that source elsewhere has other bytes and is not admitted.
[producer]
sha256 = ["298e07511310b18051a4c8ed56c18fafa03e40dc8fc88bedf74edba0e2ba41ad"]

[[rule]]
id = "no-secrets"
why = "A credential committed once is compromised forever, even after a revert."
kind = "forbid_signal"
severity = "fail"
signals = ["secret_like"]

[[rule]]
id = "no-hidden-text"
why = "Bidi controls, invisible characters and traversing paths make code read differently than it runs."
kind = "forbid_signal"
severity = "fail"
signals = ["hazardous_text"]
except = ["fixtures/**"]

[[rule]]
id = "no-unsafe"
why = "unsafe_code is forbidden workspace-wide; a diff that adds it is already wrong."
kind = "forbid_signal"
severity = "fail"
signals = ["unsafe_added"]

[[rule]]
id = "core-stays-pure"
why = "The core is a pure function (ADR 0001); spawning, fetching or eval belongs nowhere in it."
kind = "forbid_signal"
severity = "fail"
signals = ["process_spawn", "network_fetch", "dynamic_eval", "build_hook"]
paths = ["crates/forge-warden-core/**"]

[[rule]]
id = "no-ci-privilege"
why = "pull_request_target, write-all and secret inheritance hand untrusted code the keys to the repository."
kind = "forbid_signal"
severity = "fail"
signals = ["ci_privilege"]

[[rule]]
id = "no-silent-suppression"
why = "Suppressions are #[expect(lint, reason)] and reviewed; a new one needs a person to agree."
kind = "forbid_signal"
severity = "hold"
signals = ["check_suppressed"]

[[rule]]
id = "keep-the-tests"
why = "Deleting a test removes a guarantee someone relied on; that deserves a second pair of eyes."
kind = "forbid_signal"
severity = "hold"
signals = ["test_removed"]

[[rule]]
id = "tests-travel-with-code"
why = "Behaviour that changes without an integration test or fixture change is behaviour nobody pinned down; if the new tests are inline, say so in review."
kind = "require_companion"
severity = "hold"
when = ["crates/*/src/**"]
require = ["crates/*/tests/**", "fixtures/**"]

[[rule]]
id = "schema-changes-are-versioned"
why = "Consumers parse verdicts by schema name; changing a schema means a CHANGELOG entry they can find."
kind = "require_companion"
severity = "fail"
when = ["schemas/**", "crates/forge-warden-core/src/verdict.rs", "crates/forge-warden-core/src/exit.rs"]
require = ["CHANGELOG.md"]

[[rule]]
id = "quality-config-is-owned"
why = "Lints, CI, hooks and this policy decide what every other check means; loosening them needs the owner."
kind = "protect_paths"
severity = "hold"
paths = [
    ".cargo/**",
    ".claude/**",
    ".githooks/**",
    ".github/**",
    "Cargo.lock",
    "Cargo.toml",
    "agents/**",
    "clippy.toml",
    "crates/*/Cargo.toml",
    "crates/*/clippy.toml",
    "crates/*/tests/**",
    "crates/forge-warden-cli/src/doors/**",
    "crates/forge-warden-cli/tests/repo_invariants.rs",
    "deny.toml",
    "fixtures/**",
    "fixtures/coverage/MANIFEST",
    "justfile",
    "lint-expectations.toml",
    "lint-floor.toml",
    "plants/**",
    "protected-paths.txt",
    "rust-toolchain.toml",
    "rustfmt.toml",
    "schemas/**",
    "scripts/**",
    "warden.toml",
]

[[rule]]
id = "reviewable-size"
why = "A change too risky to hold in one head gets rubber-stamped; split it."
kind = "max_score"
severity = "hold"
limit = 60
per = "change"

[[rule]]
id = "one-thing-at-a-time"
why = "A pull request that touches many source files is several changes; review them separately."
kind = "max_files"
severity = "hold"
limit = 12
paths = ["crates/*/src/**"]

[[rule]]
id = "golden-output-needs-review"
why = "Declared golden outputs and their bound consumer/producer implementation require independent review; regeneration from the reviewed subject must not bless its own behaviour change. New undeclared inline expectations retain general test ownership until registered."
kind = "protect_paths"
severity = "hold"
paths = ["fixtures/**", "crates/forge-warden-cli/tests/cli.rs", "crates/forge-warden-cli/tests/common/mod.rs", "crates/forge-warden-cli/tests/oracle_contracts.rs", "scripts/golden_output.py", "scripts/golden_probe.py", "scripts/bless.sh"]
