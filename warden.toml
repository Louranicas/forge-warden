#:schema ./schemas/policy.v0.schema.json
# forge-warden judges its own pull requests with this policy (.github/workflows/ci.yml, job
# `dogfood`). It is the starter policy tightened for a Rust crate whose core must stay pure, and
# loosened in two places: no-hidden-text does not apply to fixtures/** (the hostile test inputs carry
# that signal on purpose; any fixtures change is still held for review by golden-output-needs-review
# and quality-config-is-owned), and tests-travel-with-code holds rather than fails (inline
# #[cfg(test)] tests in src/ are invisible to it, so whether a change is tested is a person's call).
schema = "forge-warden.policy.v0"

# The ranker `check --ranker` may run (authority mode): the released deep-diff-forge v0.8.3
# binary for x86_64-unknown-linux-gnu, pinned by its bytes. It is the `deep-diff-forge` file inside
# deep-diff-forge-v0.8.3-x86_64-unknown-linux-gnu.tar.gz (archive sha256 in
# scripts/tool-versions.toml), built from tag commit a74bf91f422ee2df77e8bcd12bd2dadd64a61226.
# A binary built from that source elsewhere has other bytes and is not admitted.
[producer]
sha256 = ["4cafd0ad0f44417eb0e5b8feb591109a3e055428928f2a045316046c434f0ef1"]

[[rule]]
id = "no-secrets"
why = "A credential committed once is compromised forever, even after a revert."
kind = "forbid_signal"
severity = "fail"
signals = ["secret_like"]

[[rule]]
id = "no-hidden-text"
why = "Bidi controls, invisible characters and traversing paths make code read differently than it runs."
kind = "forbid_signal"
severity = "fail"
signals = ["hazardous_text"]
except = ["fixtures/**"]

[[rule]]
id = "no-unsafe"
why = "unsafe_code is forbidden workspace-wide; a diff that adds it is already wrong."
kind = "forbid_signal"
severity = "fail"
signals = ["unsafe_added"]

[[rule]]
id = "core-stays-pure"
why = "The core is a pure function (ADR 0001); spawning, fetching or eval belongs nowhere in it."
kind = "forbid_signal"
severity = "fail"
signals = ["process_spawn", "network_fetch", "dynamic_eval", "build_hook"]
paths = ["crates/forge-warden-core/**"]

[[rule]]
id = "no-ci-privilege"
why = "pull_request_target, write-all and secret inheritance hand untrusted code the keys to the repository."
kind = "forbid_signal"
severity = "fail"
signals = ["ci_privilege"]

[[rule]]
id = "no-silent-suppression"
why = "Suppressions are #[expect(lint, reason)] and reviewed; a new one needs a person to agree."
kind = "forbid_signal"
severity = "hold"
signals = ["check_suppressed"]

[[rule]]
id = "keep-the-tests"
why = "Deleting a test removes a guarantee someone relied on; that deserves a second pair of eyes."
kind = "forbid_signal"
severity = "hold"
signals = ["test_removed"]

# A text file sent as a binary section (`GIT binary patch`, or "Binary files ... differ") has no lines the
# ranker can read, so every signal rule misses what it adds; a `.gitattributes` the change commits is enough
# to make Git write one. `binary_change` comes from Git's numstat, not from the ranker. The three globs name
# files that are normally text, by extension, by exact name (ten of Git's hook names, `configure` and
# others a shell runs) and by name prefix, in any letter case (ledger Q63). Git's other hook names
# (`post-commit`, `post-rewrite`, ...) are not listed. An executable with another name is not covered:
# protect `bin/**` and the like with a path rule.
[[rule]]
id = "binary-text-is-hidden-text"
why = "A text file sent as a binary section hides its lines from every signal rule; a person reads it."
kind = "forbid_signal"
severity = "hold"
signals = ["binary_change"]
paths = [
    "**/*.{[aA][cC],[aA][dD][oO][cC],[aA][mM],[aA][sS][mM],[aA][wW][kK],[bB][aA][sS][hH],[bB][aA][tT],[bB][zZ][lL],[cC],[cC][cC],[cC][fF][gG],[cC][jJ][sS],[cC][lL][jJ],[cC][lL][jJ][sS],[cC][mM][aA][kK][eE],[cC][mM][dD],[cC][oO][nN][fF],[cC][pP][pP],[cC][sS],[cC][sS][sS],[cC][sS][vV],[cC][tT][sS],[cC][xX][xX],[dD][aA][rR][tT],[dD][iI][fF][fF],[eE][dD][nN],[eE][lL],[eE][nN][vV],[eE][rR][bB],[eE][rR][lL],[eE][xX],[eE][xX][sS],[fF][iI][sS][hH],[fF][sS],[fF][sS][xX],[gG][oO],[gG][qQ][lL],[gG][rR][aA][dD][lL][eE],[gG][rR][aA][pP][hH][qQ][lL],[gG][rR][oO][oO][vV][yY],[hH],[hH][cC][lL],[hH][hH],[hH][pP][pP],[hH][rR][lL],[hH][sS],[hH][tT][mM],[hH][tT][mM][lL],[hH][xX][xX],[iI][nN],[iI][nN][iI],[jJ]2,[jJ][aA][vV][aA],[jJ][lL],[jJ][qQ],[jJ][sS],[jJ][sS][oO][nN],[jJ][sS][oO][nN]5,[jJ][sS][oO][nN][cC],[jJ][sS][oO][nN][lL],[jJ][sS][xX],[jJ][uU][sS][tT],[kK][tT],[kK][tT][sS],[lL][eE][sS][sS],[lL][oO][cC][kK],[lL][uU][aA],[mM],[mM]4,[mM][aA][rR][kK][dD][oO][wW][nN],[mM][dD],[mM][jJ][sS],[mM][kK],[mM][lL],[mM][lL][iI],[mM][mM],[mM][tT][sS],[nN][iI][mM],[nN][iI][xX],[pP][aA][tT][cC][hH],[pP][hH][pP],[pP][lL],[pP][lL][iI][sS][tT],[pP][mM],[pP][rR][oO][pP][eE][rR][tT][iI][eE][sS],[pP][rR][oO][tT][oO],[pP][sS]1,[pP][yY],[pP][yY][iI],[rR],[rR][bB],[rR][sS],[rR][sS][tT],[sS],[sS][aA][sS][sS],[sS][cC][aA][lL][aA],[sS][cC][sS][sS],[sS][eE][dD],[sS][eE][rR][vV][iI][cC][eE],[sS][hH],[sS][oO][cC][kK][eE][tT],[sS][oO][lL],[sS][qQ][lL],[sS][tT][aA][rR],[sS][vV][eE][lL][tT][eE],[sS][vV][gG],[sS][wW][iI][fF][tT],[tT][eE][xX],[tT][fF],[tT][fF][vV][aA][rR][sS],[tT][iI][mM][eE][rR],[tT][mM][pP][lL],[tT][oO][mM][lL],[tT][sS],[tT][sS][vV],[tT][sS][xX],[tT][xX][tT],[vV][bB],[vV][iI][mM],[vV][uU][eE],[xX][mM][lL],[yY][aA][mM][lL],[yY][mM][lL],[zZ][iI][gG],[zZ][sS][hH]}",
    "**/{.[eE][dD][iI][tT][oO][rR][cC][oO][nN][fF][iI][gG],.[eE][nN][vV][rR][cC],.[gG][iI][tT][aA][tT][tT][rR][iI][bB][uU][tT][eE][sS],.[gG][iI][tT][iI][gG][nN][oO][rR][eE],.[gG][iI][tT][mM][oO][dD][uU][lL][eE][sS],.[mM][aA][iI][lL][mM][aA][pP],.[nN][pP][mM][rR][cC],[aA][lL][lL][oO][wW][eE][dD]_[sS][iI][gG][nN][eE][rR][sS],[aA][uU][tT][hH][oO][rR][sS],[bB][uU][iI][lL][dD],[cC][hH][aA][nN][gG][eE][lL][oO][gG],[cC][oO][dD][eE][oO][wW][nN][eE][rR][sS],[cC][oO][mM][mM][iI][tT]-[mM][sS][gG],[cC][oO][nN][fF][iI][gG][uU][rR][eE],[cC][oO][nN][tT][aA][iI][nN][eE][rR][fF][iI][lL][eE],[cC][oO][pP][yY][iI][nN][gG],[dD][oO][cC][kK][eE][rR][fF][iI][lL][eE],[gG][eE][mM][fF][iI][lL][eE],[gG][nN][uU][mM][aA][kK][eE][fF][iI][lL][eE],[gG][oO].[mM][oO][dD],[gG][oO].[sS][uU][mM],[jJ][eE][nN][kK][iI][nN][sS][fF][iI][lL][eE],[jJ][uU][sS][tT][fF][iI][lL][eE],[lL][iI][cC][eE][nN][sS][eE],[mM][aA][kK][eE][fF][iI][lL][eE],[nN][oO][tT][iI][cC][eE],[pP][oO][sS][tT]-[cC][hH][eE][cC][kK][oO][uU][tT],[pP][oO][sS][tT]-[mM][eE][rR][gG][eE],[pP][oO][sS][tT]-[rR][eE][cC][eE][iI][vV][eE],[pP][rR][eE]-[cC][oO][mM][mM][iI][tT],[pP][rR][eE]-[pP][uU][sS][hH],[pP][rR][eE]-[rR][eE][bB][aA][sS][eE],[pP][rR][eE]-[rR][eE][cC][eE][iI][vV][eE],[pP][rR][eE][pP][aA][rR][eE]-[cC][oO][mM][mM][iI][tT]-[mM][sS][gG],[pP][rR][oO][cC][fF][iI][lL][eE],[rR][aA][kK][eE][fF][iI][lL][eE],[rR][eE][aA][dD][mM][eE],[uU][pP][dD][aA][tT][eE],[vV][aA][gG][rR][aA][nN][tT][fF][iI][lL][eE],[wW][oO][rR][kK][sS][pP][aA][cC][eE]}",
    "**/{[cC][oO][pP][yY][iI][nN][gG].*,[dD][oO][cC][kK][eE][rR][fF][iI][lL][eE].*,[lL][iI][cC][eE][nN][sS][eE]-*}",
]

[[rule]]
id = "tests-travel-with-code"
why = "Behaviour that changes without an integration test or fixture change is behaviour nobody pinned down; if the new tests are inline, say so in review."
kind = "require_companion"
severity = "hold"
when = ["crates/*/src/**"]
require = ["crates/*/tests/**", "fixtures/**"]

[[rule]]
id = "schema-changes-are-versioned"
why = "Consumers parse verdicts by schema name; changing a schema means a CHANGELOG entry they can find."
kind = "require_companion"
severity = "fail"
when = ["schemas/**", "crates/forge-warden-core/src/verdict.rs", "crates/forge-warden-core/src/exit.rs"]
require = ["CHANGELOG.md"]

[[rule]]
id = "quality-config-is-owned"
why = "Lints, CI, hooks and this policy decide what every other check means; loosening them needs the owner."
kind = "protect_paths"
severity = "hold"
paths = [
    ".cargo/**",
    ".claude/**",
    ".githooks/**",
    ".github/**",
    "Cargo.lock",
    "Cargo.toml",
    "agents/**",
    "clippy.toml",
    "crates/*/Cargo.toml",
    "crates/*/clippy.toml",
    "crates/*/tests/**",
    "crates/forge-warden-cli/src/doors/**",
    "crates/forge-warden-cli/tests/repo_invariants.rs",
    "deny.toml",
    "fixtures/**",
    "fixtures/coverage/MANIFEST",
    "justfile",
    "lint-expectations.toml",
    "lint-floor.toml",
    "plants/**",
    "protected-paths.txt",
    "rust-toolchain.toml",
    "rustfmt.toml",
    "schemas/**",
    "scripts/**",
    "warden.toml",
]

[[rule]]
id = "reviewable-size"
why = "A change too risky to hold in one head gets rubber-stamped; split it."
kind = "max_score"
severity = "hold"
limit = 60
per = "change"

[[rule]]
id = "one-thing-at-a-time"
why = "A pull request that touches many source files is several changes; review them separately."
kind = "max_files"
severity = "hold"
limit = 12
paths = ["crates/*/src/**"]

[[rule]]
id = "golden-output-needs-review"
why = "Declared golden outputs and their bound consumer/producer implementation require independent review; regeneration from the reviewed subject must not bless its own behaviour change. New undeclared inline expectations retain general test ownership until registered."
kind = "protect_paths"
severity = "hold"
paths = ["fixtures/**", "crates/forge-warden-cli/tests/cli.rs", "crates/forge-warden-cli/tests/common/mod.rs", "crates/forge-warden-cli/tests/oracle_contracts.rs", "scripts/golden_output.py", "scripts/golden_probe.py", "scripts/bless.sh"]
