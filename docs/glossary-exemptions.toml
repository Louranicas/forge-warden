# Reviewed scope exceptions; exact paths only, never patterns.
# dated_releases: only top-level ## [x.y.z] - YYYY-MM-DD sections.
# dated_evidence: only top-level ## x.y.z (YYYY-MM-DD) or Independent review (YYYY-MM-DD).
# Each section ends at the next top-level H1/H2; preambles and undated sections are linted.
# quoted_terms alone exempts a whole document that defines forbidden phrases as data.
[[exemption]]
path = "CHANGELOG.md"
kind = "dated_releases"
reason = "Append-only dated release history preserves the vocabulary used at that time."

[[exemption]]
path = "EVIDENCE.md"
kind = "dated_evidence"
reason = "Append-only dated measurement records preserve the original evidence and wording."

[[exemption]]
path = "docs/GLOSSARY.md"
kind = "quoted_terms"
reason = "The canonical term table deliberately quotes every forbidden synonym as lint data."
