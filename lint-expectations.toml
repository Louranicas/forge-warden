file = "schemas/verdict.v3.schema.json"
sha256 = "a4866a3d8e8e3cadee2d7d5d235ba79bf8905e95377a42f4cd0024c91963cfe8"
review_reason = "PATCH-BOUND (ADR 0012, ruling R1) v3 schema: v2 with seals.claims oneOf bound (base, head, merge_base, verified true) or v2's asserted object. Historical v1 and v2 remain byte-exact and are no longer compiled. M7-Q64 (ruling R-a) adds the built-in rule to v3 before its release: a rule id may be `builtin:` then kebab-case, kind gains `builtin`, and an allOf clause ties kind builtin to a builtin: id, severity hold, outcome hold and violations without waived_by (every other kind keeps the kebab-case id). PATCH-BOUND (c) part 1 (Q73) splits the bound claims by id length (SHA-1 40, SHA-256 64)."

[[data_input]]
file = "schemas/policy.v1.schema.json"
sha256 = "6b614311cd276d115fc7a34131121d95e5fe59250cfdd759d26660c57894c5a5"
review_reason = "PATCH-BOUND (c1, ADR 0012 D8, R2 reversal): policy v1 = v0 plus the optional [claims] table (require_verified, boolean, closed object); GitLab raw $id. v0 stays byte-exact and is no longer compiled; the reader still accepts v0 documents."

[[data_input]]
file = "examples/starter.warden.toml"
sha256 = "a51698969cafc0ac540d44a3096ccffb090ebc0f029f861ceed6fe2db19411c8"
review_reason = "Embedded starter policy is TOML data, reviewed as TOML rather than Rust source. M7-PROTECT-CLAUDE (2026-11-15) added .claude (the entry, everything under it, any letter case, root or nested) to ci-is-owned, with a comment. M7-BINARY-TEXT-HOLD (2026-11-16) added rule binary-text-is-hidden-text. Ruling 1068 added hook names, configure, allowed_signers, 14 extensions and 3 name prefixes. M7-PREP-0.2.1 (2026-11-16): the binary-text comment says ten of Git's hook names are listed, not all (reviewer finding 1); comment only. PATCH-BOUND (c) part 2 (ruling 1663, 2026-11-16): schema forge-warden.policy.v1, [claims] require_verified = true with a comment, and the #:schema line names the GitLab raw URL of policy.v1. Bastion LOW 3 on c2: the binary-text comment no longer says an executable with another name is not covered (the built-in rule binary-on-executable holds it since M7-Q64); comment only. M7-CI-LOCAL-BOUND (ledger Q85, ruling 2151, 2026-11-18): ci-is-owned also holds .gitlab-ci.yml, .gitlab, .gitea and .forgejo (the entry and everything under it, root or nested, any letter case), with a comment. Forge ownership now covers root CI entries and their descendants, including the exact .github entry. The starter digest moved from 56cd8685 through 70e5060c (the GitHub-entry revision) to a5169896."

