sha256 = "9961461d04320a659a4cf7ea68e7b8521be3fbdc8ba98a2bbf3b10f1c4a9ae88"
review_reason = "E3a test-only external SHA256 reference object, parsed as JSON and compared with independently hashed committed policy, rank and patch bytes; not executable source. M7-PROTECT-CLAUDE (2026-11-15) changed policy_sha256 to the new starter policy digest (GNU sha256sum). M7-BINARY-TEXT-HOLD (2026-11-16) moved policy_sha256 again. M7-PREP-0.2.1 (2026-11-16) moved it with the starter's comment. PATCH-BOUND (c) part 2 (owner decision D2, ruling 1663): only policy_sha256 changes, to f97f2e2e, the starter policy as forge-warden.policy.v1 with [claims] require_verified; recomputed by Touchstone with GNU sha256sum over the committed bytes, byte-equal to the builder's expectation. PATCH-BOUND (c) part 2, second D2 (Keel 1729, Bastion LOW 3): policy_sha256 now aef395ee, the starter after its binary-text comment fix; regenerated by Touchstone (bless path / GNU sha256sum), byte-equal to the builder's expectation. M7-CI-LOCAL-BOUND (Q85, D2 by Touchstone): the starter policy's digest moved aef395ee -> 56cd8685 with the new GitLab/Gitea/Forgejo ci-is-owned globs; seal reference recomputed with GNU sha256sum, demo verdict regenerated through the bless path (only policy_sha256 changes). The reference now seals starter a5169896, following 56cd8685 and 70e5060c (the GitHub-entry revision), for forge ownership confined to root CI entries and descendants."

