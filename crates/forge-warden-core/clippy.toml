# forge-warden-core is pure (ADR 0001): bytes and values in, values out. It reaches nothing
# outside the process, and nothing it computes may depend on iteration order it does not choose.
# This file is the core crate's whole clippy configuration (clippy uses the nearest clippy.toml),
# so the CLI's effect doors are deliberately absent: the core has no doors at all.
avoid-breaking-exported-api = false
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true

disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is random; use BTreeMap so output is deterministic" },
    { path = "std::collections::HashSet", reason = "iteration order is random; use BTreeSet so output is deterministic" },
    { path = "std::fs::File", reason = "the core does no I/O (ADR 0001); the CLI reads bytes through a door and passes them in" },
    { path = "std::process::Command", reason = "the core spawns nothing (ADR 0001)" },
    { path = "std::net::TcpStream", reason = "the core reaches no network (ADR 0001)" },
    { path = "std::time::Instant", reason = "the core reads no clock; time arrives as a value (ADR 0001)" },
    { path = "std::time::SystemTime", reason = "the core reads no clock; time arrives as a value (ADR 0001)" },
    { path = "std::fs::OpenOptions", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::net::TcpListener", reason = "the core reaches no network (ADR 0001)" },
    { path = "std::net::UdpSocket", reason = "the core reaches no network (ADR 0001)" },
    { path = "std::hash::RandomState", reason = "a random hasher makes output order depend on a seed; use BTree collections" },
    { path = "std::hash::DefaultHasher", reason = "hash values are not stable across runs or versions; output must be deterministic" },
]

disallowed-methods = [
    { path = "std::fs::read", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::read_to_string", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::write", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::io::stdin", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::io::stdout", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::io::stderr", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::env::var", reason = "the core reads no environment (ADR 0001)" },
    { path = "std::env::var_os", reason = "the core reads no environment (ADR 0001)" },
    { path = "std::env::args", reason = "the core reads no arguments (ADR 0001)" },
    { path = "std::thread::spawn", reason = "the core is single-threaded and deterministic (ADR 0001)" },
    { path = "std::thread::sleep", reason = "the core never waits (ADR 0001)" },
    { path = "std::fs::read_dir", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::metadata", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::symlink_metadata", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::canonicalize", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::read_link", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::copy", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::rename", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::create_dir", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::create_dir_all", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::remove_file", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::remove_dir_all", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::File::open", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::File::create", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::env::args_os", reason = "the core reads no arguments (ADR 0001)" },
    { path = "std::env::vars", reason = "the core reads no environment (ADR 0001)" },
    { path = "std::env::vars_os", reason = "the core reads no environment (ADR 0001)" },
    { path = "std::env::current_dir", reason = "the core reads no environment (ADR 0001)" },
    { path = "std::env::temp_dir", reason = "the core reads no environment (ADR 0001)" },
    { path = "std::process::exit", reason = "the core never ends the process; it returns a Verdict" },
    { path = "std::process::abort", reason = "the core never ends the process; it returns a Verdict" },
]
