# forge-warden-core is pure (ADR 0001): bytes and values in, values out. It reaches nothing
# outside the process, and nothing it computes may depend on iteration order it does not choose.
# This file is the core crate's whole clippy configuration (clippy uses the nearest clippy.toml),
# so the CLI's effect doors are deliberately absent: the core has no doors at all.
avoid-breaking-exported-api = false
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true

disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is random; use BTreeMap so output is deterministic" },
    { path = "std::collections::HashSet", reason = "iteration order is random; use BTreeSet so output is deterministic" },
    { path = "std::fs::File", reason = "the core does no I/O (ADR 0001); the CLI reads bytes through a door and passes them in" },
    { path = "std::process::Command", reason = "the core spawns nothing (ADR 0001)" },
    { path = "std::net::TcpStream", reason = "the core reaches no network (ADR 0001)" },
    { path = "std::time::Instant", reason = "the core reads no clock; time arrives as a value (ADR 0001)" },
    { path = "std::time::SystemTime", reason = "the core reads no clock; time arrives as a value (ADR 0001)" },
]

disallowed-methods = [
    { path = "std::fs::read", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::read_to_string", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::fs::write", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::io::stdin", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::io::stdout", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::io::stderr", reason = "the core does no I/O (ADR 0001)" },
    { path = "std::env::var", reason = "the core reads no environment (ADR 0001)" },
    { path = "std::env::var_os", reason = "the core reads no environment (ADR 0001)" },
    { path = "std::env::args", reason = "the core reads no arguments (ADR 0001)" },
    { path = "std::thread::spawn", reason = "the core is single-threaded and deterministic (ADR 0001)" },
    { path = "std::thread::sleep", reason = "the core never waits (ADR 0001)" },
]
