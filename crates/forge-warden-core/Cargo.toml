[package]
name = "forge-warden-core"
description = "Pure policy engine for forge-warden: evaluates change policy over sealed deep-diff-forge rankings."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# Test-only door: exposes the raw rule engine (`testing::evaluate`), which can pass with no
# provenance. Enabled only by this workspace's [dev-dependencies]; never by a normal dependency.
unattested-evaluate = []

[dependencies]
globset.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
# The engine tests (tests/*.rs) judge raw rankings through the unattested-evaluate door.
forge-warden-core = { path = ".", features = ["unattested-evaluate"] }
proptest.workspace = true
