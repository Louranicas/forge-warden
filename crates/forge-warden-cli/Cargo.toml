[package]
name = "forge-warden-cli"
description = "forge-warden: change policy as code for deep-diff-forge reviews. A sealed, deterministic gate for CI and agents."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "forge-warden"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
forge-warden-core.workspace = true
serde_json.workspace = true

[dev-dependencies]
# tests/corpus.rs judges raw rankings through the unattested-evaluate door; the binary never enables it.
forge-warden-core = { workspace = true, features = ["unattested-evaluate"] }
proptest.workspace = true
pulldown-cmark.workspace = true
proc-macro2.workspace = true
serde_json.workspace = true
syn.workspace = true
toml.workspace = true

# A stand-in ranker for authority-mode tests (tests/support/fixture_ranker.rs). `cargo test` builds
# examples, and the tests run it from target/<profile>/examples/. It is never installed.
[[example]]
name = "fixture-ranker"
path = "tests/support/fixture_ranker.rs"
test = false
