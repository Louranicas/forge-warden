# Exercises every optional member of the verdict (tests/schema_tracks_code.rs).
schema = "forge-warden.policy.v0"

[[rule]]
id = "no-unsafe"
why = "Unsafe code needs a dedicated safety review."
kind = "forbid_signal"
severity = "fail"
signals = ["unsafe_added"]

[[rule]]
id = "small-changes"
why = "Small changes get real review."
kind = "max_files"
severity = "hold"
limit = 1

[[waiver]]
rule = "no-unsafe"
paths = ["src/simd/**"]
reason = "Audited SIMD kernel; re-audit before renewing."
owner = "@louranicas"
expires = "2026-12-31"

[[waiver]]
rule = "no-unsafe"
paths = ["src/old/**"]
reason = "An exemption whose date has passed."
owner = "@louranicas"
expires = "2026-01-31"

[[waiver]]
rule = "small-changes"
paths = ["docs/**"]
reason = "A live exemption that matches nothing in this change."
owner = "@louranicas"
expires = "2026-12-31"
