# Effect doors (ADR 0001). Outside the pure core, a method below may be called only inside a
# function that carries `#[expect(clippy::disallowed_methods, reason = "door: <name>")]`, and the
# doors live in one module (`crates/forge-warden-cli/src/doors.rs`). A new effect is therefore a
# reviewed diff to that one file, never a line anywhere. `repo_invariants.rs` checks that no other
# file names a door.
avoid-breaking-exported-api = false
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true

disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is random; use BTreeMap so output is deterministic" },
    { path = "std::collections::HashSet", reason = "iteration order is random; use BTreeSet so output is deterministic" },
    { path = "std::hash::RandomState", reason = "a random hasher makes output order depend on a seed; use BTree collections" },
    { path = "std::hash::DefaultHasher", reason = "hash values are not stable across runs or versions; output must be deterministic" },
    { path = "std::fs::OpenOptions", reason = "read files only through doors::read_file; forge-warden never writes files" },
    { path = "std::net::TcpStream", reason = "forge-warden reaches no network" },
    { path = "std::net::TcpListener", reason = "forge-warden reaches no network" },
    { path = "std::net::UdpSocket", reason = "forge-warden reaches no network" },
]

disallowed-methods = [
    { path = "std::fs::read", reason = "read files only through doors::read_file" },
    { path = "std::fs::File::open", reason = "read files only through doors::read_file" },
    { path = "std::fs::File::create", reason = "forge-warden never writes files" },
    { path = "std::fs::read_to_string", reason = "read files only through doors::read_file" },
    { path = "std::fs::write", reason = "forge-warden never writes files" },
    { path = "std::fs::remove_file", reason = "forge-warden never deletes files" },
    { path = "std::fs::remove_dir_all", reason = "forge-warden never deletes files" },
    { path = "std::io::stdin", reason = "read stdin only through doors::read_stdin" },
    { path = "std::io::stdout", reason = "write stdout only through doors::emit" },
    { path = "std::io::stderr", reason = "write stderr only through doors::diagnose" },
    { path = "std::env::var", reason = "forge-warden reads no environment; configuration is explicit" },
    { path = "std::env::var_os", reason = "forge-warden reads no environment; configuration is explicit" },
    { path = "std::process::Command::new", reason = "children (the pinned ranker, Git, and /usr/bin/kill for cleanup) start only in doors.rs" },
    { path = "std::time::SystemTime::now", reason = "read the clock only through doors::today" },
    { path = "std::time::Instant::now", reason = "only the child door measures time, for its deadline" },
    { path = "std::thread::sleep", reason = "only the child door waits, polling a bounded child" },
    { path = "std::thread::spawn", reason = "forge-warden is single-threaded; a door that needs concurrency is a reviewed design change" },
    { path = "std::env::args", reason = "arguments are parsed by clap in main; nothing else reads them" },
    { path = "std::env::args_os", reason = "arguments are parsed by clap in main; nothing else reads them" },
    { path = "std::env::vars", reason = "forge-warden reads no environment; configuration is explicit" },
    { path = "std::env::vars_os", reason = "forge-warden reads no environment; configuration is explicit" },
    { path = "std::env::current_dir", reason = "paths are taken as given; forge-warden does not depend on its working directory" },
    { path = "std::env::set_current_dir", reason = "forge-warden never changes its working directory" },
    { path = "std::env::temp_dir", reason = "forge-warden writes no temporary files" },
    { path = "std::fs::read_dir", reason = "forge-warden reads only the files it is given, through doors::read_file" },
    { path = "std::fs::metadata", reason = "forge-warden reads only the files it is given, through doors::read_file" },
    { path = "std::fs::symlink_metadata", reason = "forge-warden reads only the files it is given, through doors::read_file" },
    { path = "std::fs::canonicalize", reason = "paths are taken as given; forge-warden does not resolve them" },
    { path = "std::fs::read_link", reason = "forge-warden reads only the files it is given, through doors::read_file" },
    { path = "std::fs::copy", reason = "forge-warden never writes files" },
    { path = "std::fs::rename", reason = "forge-warden never writes files" },
    { path = "std::fs::create_dir", reason = "forge-warden never writes files" },
    { path = "std::fs::create_dir_all", reason = "forge-warden never writes files" },
    { path = "forge_warden_core::authority::Ranking::attest", reason = "only doors::child::produce_ranking mints a produced ranking, right after the pinned ranker ran (ADR 0005 §2.7)" },
    { path = "forge_warden_core::verdict::GitOracle::approved", reason = "only doors::child::AdmittedGit::oracle records a Git, from the admission that pinned it (Q-TYPES-2 B2; Q-TYPES-2.1)" },
    { path = "forge_warden_core::verdict::GitOracle::unpinned", reason = "only doors::child::AdmittedGit::oracle records a Git, from the admission that pinned it (Q-TYPES-2 B2; Q-TYPES-2.1)" },
    { path = "forge_warden_core::testing::evaluate", reason = "the binary judges only through evaluate_authority / evaluate_advisory; the raw engine is a test door (feature unattested-evaluate, dev-dependencies only; Q-TYPES-1)" },
    { path = "core::option::Option::unwrap_or", reason = "name the default: forge_warden_core::defaults::NamedDefault (G-04)" },
    { path = "core::option::Option::unwrap_or_else", reason = "name the default: forge_warden_core::defaults::NamedDefault (G-04)" },
    { path = "core::option::Option::unwrap_or_default", reason = "name the default: forge_warden_core::defaults::NamedDefault (G-04)" },
    { path = "core::result::Result::unwrap_or", reason = "name the default: forge_warden_core::defaults::NamedDefault (G-04)" },
    { path = "core::result::Result::unwrap_or_else", reason = "name the default: forge_warden_core::defaults::NamedDefault (G-04)" },
    { path = "core::result::Result::unwrap_or_default", reason = "name the default: forge_warden_core::defaults::NamedDefault (G-04)" },
    { path = "core::option::Option::map_or", reason = "map, then name the default: .map(f).or_fail_closed / or_fail_safe / or_display (G-04, B7.1)" },
    { path = "core::option::Option::map_or_else", reason = "map, then name the default: .map(f).or_fail_closed_with / or_fail_safe / or_display (G-04, B7.1)" },
    { path = "core::result::Result::map_or", reason = "map, then name the default: .map(f).or_fail_closed / or_fail_safe / or_display (G-04, B7.1)" },
    { path = "core::result::Result::map_or_else", reason = "map, then name the default: .map(f).or_fail_closed_with / or_fail_safe / or_display (G-04, B7.1)" },
    { path = "core::option::Option::get_or_insert", reason = "a stored default is a default: match, or name it with NamedDefault (G-04, B7.1)" },
    { path = "core::option::Option::get_or_insert_with", reason = "a stored default is a default: match, or name it with NamedDefault (G-04, B7.1)" },
    { path = "core::option::Option::get_or_insert_default", reason = "a stored default is a default: match, or name it with NamedDefault (G-04, B7.1)" },
]
