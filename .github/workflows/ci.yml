# Required checks retain their names; mutation workers report through one aggregate check.
# Hardening: read-only token by default, no persisted credentials, every action pinned to a commit
# SHA (the trailing comment names the tag; dependabot keeps both current), and `zizmor` audits
# this file on every run.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  # deep-diff-forge, pinned by commit, for the dogfood job and the vocabulary check.
  DDF_REV: fb5ffe15ae582f665d9de073d5231ecff8003a17

jobs:
  gate:
    timeout-minutes: 45
    name: gate (fmt, clippy, test, doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy && rustup default 1.99.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-mutants@27.1.0
      - name: Prepare MSRV for the planted regression gate
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: Prepare locked dependencies for offline script fixtures
        run: cargo fetch --locked
      - run: python3 -I scripts/tool_versions.py --check
      - run: python3 -I scripts/tool_versions.py --check-toolchain
      - run: python3 -I scripts/tests/perimeter.py
      - run: python3 -I scripts/tests/mutation_budget.py
      - run: python3 -I scripts/tests/runner_routing.py
      - run: bash scripts/tests/ci_local.sh
      - run: python3 -I scripts/tests/mutation_env.py
      - run: python3 -I scripts/tests/local_tools.py
      - run: bash scripts/tests/dogfood.sh
      - run: python3 -I scripts/tests/hold_ack.py
      - run: python3 -I .claude/hooks/test_guard.py
      - run: python3 -I scripts/tests/managed_review_bundle.py
      - run: python3 -I scripts/tests/guardrails.py
      - run: python3 -I scripts/check_guardrails.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
      - run: python3 -I plants/test_runner.py
      - run: python3 -I scripts/check_plants.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guardrail-plants
          path: target/plants-*

  msrv:
    timeout-minutes: 10
    name: declared Rust 1.88 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal && rustup default 1.88.0
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo +1.88.0 check --workspace --all-targets --locked
        env:
          # The MSRV toolchain may not know newer lints; the gate job runs the full wall.
          RUSTFLAGS: ""

  supply-chain:
    timeout-minutes: 10
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  workflow-audit:
    timeout-minutes: 10
    name: workflow audit (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: zizmor@1.30.1
      - run: zizmor --persona=pedantic .github/workflows

  mutation-plan:
    timeout-minutes: 10
    name: plan mutation shards
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-mutants@27.1.0
      - run: python3 -I scripts/tool_versions.py --check
      - name: Count the complete mutation inventory and size budgets
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 -I scripts/mutation_ci.py plan diff

  mutation-shards:
    timeout-minutes: ${{ matrix.minutes }}
    name: mutation shard ${{ matrix.index }}
    needs: [mutation-plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-mutants@27.1.0
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo fetch --locked
      - name: Record the exact subject and tool versions
        run: |
          git rev-parse HEAD > mutation-provenance.txt
          rustc --version >> mutation-provenance.txt
          cargo mutants --version >> mutation-provenance.txt
          cat scripts/tool-versions.toml >> mutation-provenance.txt
      - name: Verify inventory and test every mutant assigned to this shard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          SHARD_INDEX: ${{ matrix.index }}
          SHARD_COUNT: ${{ matrix.shards }}
          MUTANT_TOTAL: ${{ matrix.total }}
          INVENTORY_DIGEST: ${{ matrix.digest }}
          SHARD_MINUTES: ${{ matrix.minutes }}
        run: python3 -I scripts/mutation_ci.py run diff
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-shard-${{ matrix.index }}
          path: |
            mutants.out
            mutation-provenance.txt
          if-no-files-found: error
          retention-days: 30

  mutation:
    timeout-minutes: 5
    name: diff mutation (cargo-mutants)
    needs: [mutation-plan, mutation-shards]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require successful planning and every shard
        env:
          PLAN_RESULT: ${{ needs.mutation-plan.result }}
          SHARD_RESULT: ${{ needs.mutation-shards.result }}
        run: python3 -I scripts/mutation_ci.py aggregate

  # Repository-local workflow alone cannot enforce its own immutability: see ADR 0006.
  dogfood:
    timeout-minutes: 10
    name: dogfood (trusted base judges candidate data)
    # Hosted dogfood is advisory by decision: this runner has no owner-enrolled Git allowlist, so
    # it cannot judge in authority mode, and its result cannot PASS. A base whose driver is v2 is
    # asked for that explicitly; an older base (v1, no producer pin) is advisory already.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Judge using only the base driver, source and policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          if grep -qx '# forge-warden trusted-dogfood-driver v2' trusted/scripts/dogfood.sh; then
            set -- --hosted-advisory
          else
            grep -qx '# forge-warden trusted-dogfood-driver v1' trusted/scripts/dogfood.sh
            set --
          fi
          bash trusted/scripts/dogfood.sh "$@" "$BASE_SHA" "$HEAD_SHA" \
            "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/warden-evidence"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warden-verdict
          path: |
            ${{ runner.temp }}/warden-evidence/change.patch
            ${{ runner.temp }}/warden-evidence/rank.json
            ${{ runner.temp }}/warden-evidence/verdict.json
            ${{ runner.temp }}/warden-evidence/policy.toml
            ${{ runner.temp }}/warden-evidence/provenance.txt
            ${{ runner.temp }}/warden-evidence/acknowledgement.json

  vocabulary:
    timeout-minutes: 10
    name: vocabulary tracks deep-diff-forge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare signal labels with deep-diff-forge's source at the pinned commit
        run: scripts/check_vocab.sh "${DDF_REV}"
