# Every job here is a required check on `main` (see CONTRIBUTING.md#branch-protection).
# Hardening: read-only token by default, no persisted credentials, every action pinned to a commit
# SHA (the trailing comment names the tag; dependabot keeps both current), and `zizmor` audits
# this file on every run.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  # deep-diff-forge, pinned by commit, for the dogfood job and the vocabulary check.
  DDF_REV: 587a6afd559a4bd9f8c0aabcef4c1e5de85ffc54

jobs:
  gate:
    name: gate (fmt, clippy, test, doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: bash scripts/tests/ci_local.sh
      - run: python3 -I scripts/tests/mutation_env.py
      - run: bash scripts/tests/dogfood.sh
      - run: python3 -I scripts/tests/hold_ack.py
      - run: python3 -I .claude/hooks/test_guard.py
      - run: python3 -I scripts/tests/managed_review_bundle.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked

  msrv:
    name: declared Rust 1.88 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal && rustup default 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +1.88.0 check --workspace --all-targets --locked
        env:
          # The MSRV toolchain may not know newer lints; the gate job runs the full wall.
          RUSTFLAGS: ""

  supply-chain:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  workflow-audit:
    name: workflow audit (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: zizmor
      - run: zizmor --persona=pedantic .github/workflows

  mutation:
    name: diff mutation (cargo-mutants)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-mutants
      - name: Mutate only the lines this pull request changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff "${BASE_SHA}...HEAD" -- 'crates/*/src/**.rs' > pr.diff
          if [ ! -s pr.diff ]; then echo "no Rust source changed"; exit 0; fi
          # --no-config: a pull request cannot shrink its own mutation scope via .cargo/mutants.toml.
          env -u CARGO_TARGET_DIR cargo mutants --no-config --cap-lints true --in-diff pr.diff --workspace --no-shuffle -vV
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out
          path: mutants.out

  # Repository-local workflow alone cannot enforce its own immutability: see ADR 0006.
  dogfood:
    name: dogfood (trusted base judges candidate data)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Judge using only the base driver, source and policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          grep -qx '# forge-warden trusted-dogfood-driver v1' trusted/scripts/dogfood.sh
          bash trusted/scripts/dogfood.sh "$BASE_SHA" "$HEAD_SHA" \
            "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/warden-evidence"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warden-verdict
          path: |
            ${{ runner.temp }}/warden-evidence/change.patch
            ${{ runner.temp }}/warden-evidence/rank.json
            ${{ runner.temp }}/warden-evidence/verdict.json
            ${{ runner.temp }}/warden-evidence/policy.toml
            ${{ runner.temp }}/warden-evidence/provenance.txt
            ${{ runner.temp }}/warden-evidence/acknowledgement.json

  vocabulary:
    name: vocabulary tracks deep-diff-forge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare signal labels with deep-diff-forge's source at the pinned commit
        run: scripts/check_vocab.sh "${DDF_REV}"
