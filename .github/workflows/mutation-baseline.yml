# Periodic audit only: not a required pull-request check.
name: mutation-baseline

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-baseline
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  route:
    timeout-minutes: 5
    name: route (runner-up for merged main only)
    # WP-RUNNER-UP: the only place the pool is chosen. Exact (case-sensitive) bash comparisons: the
    # self-hosted runner-up pool only for push, schedule or dispatch on exactly refs/heads/main while
    # it is protected; everything else, every pull request and merge_group included, is hosted.
    # Expression `==` would ignore case (a protected MAIN would match), so the decision is not made
    # in an expression. scripts/tests/runner_routing.py runs this exact script over a truth table.
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PROTECTED: ${{ github.ref_protected }}
        run: |
          runner=ubuntu-latest
          case "$EVENT" in
            push|schedule|workflow_dispatch)
              if [ "$REF" = refs/heads/main ] && [ "$PROTECTED" = true ]; then
                runner=runner-up-kinoite
              fi
              ;;
          esac
          printf 'runner=%s\n' "$runner" >> "$GITHUB_OUTPUT"
          printf 'route: event=%s ref=%s protected=%s -> %s\n' "$EVENT" "$REF" "$PROTECTED" "$runner"

  mutation-plan:
    timeout-minutes: 10
    name: plan mutation shards
    # WP-RUNNER-UP: routed by the hosted `route` job; hosted if it fails or gives no output.
    needs: route
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.route.outputs.runner || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare a self-hosted runner-up guest (hosted images ship these tools)
        if: runner.environment == 'self-hosted'
        run: bash scripts/guest_bootstrap.sh
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants@27.1.0
      - run: python3 -I scripts/tool_versions.py --check
      - name: Count the complete mutation inventory and size budgets
        id: plan
        run: python3 -I scripts/mutation_ci.py plan full

  mutation-shards:
    timeout-minutes: ${{ matrix.minutes }}
    name: mutation shard ${{ matrix.index }}
    # WP-RUNNER-UP: routed like mutation-plan. Runs only on a successful plan; a failed route alone
    # still runs it, hosted.
    needs: [route, mutation-plan]
    if: ${{ !cancelled() && needs.mutation-plan.result == 'success' }}
    runs-on: ${{ needs.route.outputs.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare a self-hosted runner-up guest (hosted images ship these tools)
        if: runner.environment == 'self-hosted'
        run: bash scripts/guest_bootstrap.sh
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants@27.1.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fetch --locked
      - name: Record the exact subject and tool versions
        run: |
          git rev-parse HEAD > mutation-provenance.txt
          rustc --version >> mutation-provenance.txt
          cargo mutants --version >> mutation-provenance.txt
          cat scripts/tool-versions.toml >> mutation-provenance.txt
      - name: Verify inventory and test every mutant assigned to this shard
        env:
          SHARD_INDEX: ${{ matrix.index }}
          SHARD_COUNT: ${{ matrix.shards }}
          MUTANT_TOTAL: ${{ matrix.total }}
          INVENTORY_DIGEST: ${{ matrix.digest }}
          SHARD_MINUTES: ${{ matrix.minutes }}
        run: python3 -I scripts/mutation_ci.py run full
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-shard-${{ matrix.index }}
          path: |
            mutants.out
            mutation-provenance.txt
          if-no-files-found: error
          retention-days: 30

  full-workspace:
    timeout-minutes: 5
    name: full workspace mutation baseline
    needs: [mutation-plan, mutation-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require successful planning and every shard
        env:
          PLAN_RESULT: ${{ needs.mutation-plan.result }}
          SHARD_RESULT: ${{ needs.mutation-shards.result }}
        run: python3 -I scripts/mutation_ci.py aggregate
