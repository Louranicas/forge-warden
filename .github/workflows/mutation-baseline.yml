# Periodic audit only: not a required pull-request check.
name: mutation-baseline

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-baseline
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  mutation-plan:
    timeout-minutes: 10
    name: plan mutation shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-mutants@27.1.0
      - run: python3 -I scripts/tool_versions.py --check
      - name: Count the complete mutation inventory and size budgets
        id: plan
        run: python3 -I scripts/mutation_ci.py plan full

  mutation-shards:
    timeout-minutes: ${{ matrix.minutes }}
    name: mutation shard ${{ matrix.index }}
    needs: [mutation-plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-mutants@27.1.0
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo fetch --locked
      - name: Record the exact subject and tool versions
        run: |
          git rev-parse HEAD > mutation-provenance.txt
          rustc --version >> mutation-provenance.txt
          cargo mutants --version >> mutation-provenance.txt
          cat scripts/tool-versions.toml >> mutation-provenance.txt
      - name: Verify inventory and test every mutant assigned to this shard
        env:
          SHARD_INDEX: ${{ matrix.index }}
          SHARD_COUNT: ${{ matrix.shards }}
          MUTANT_TOTAL: ${{ matrix.total }}
          INVENTORY_DIGEST: ${{ matrix.digest }}
          SHARD_MINUTES: ${{ matrix.minutes }}
        run: python3 -I scripts/mutation_ci.py run full
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-shard-${{ matrix.index }}
          path: |
            mutants.out
            mutation-provenance.txt
          if-no-files-found: error
          retention-days: 30

  full-workspace:
    timeout-minutes: 5
    name: full workspace mutation baseline
    needs: [mutation-plan, mutation-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require successful planning and every shard
        env:
          PLAN_RESULT: ${{ needs.mutation-plan.result }}
          SHARD_RESULT: ${{ needs.mutation-shards.result }}
        run: python3 -I scripts/mutation_ci.py aggregate
