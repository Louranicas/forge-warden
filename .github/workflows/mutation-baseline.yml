# PROOF BRANCH ONLY (wp/RUNNER-UP-proof-v6, never merged). Periodic audit only: not a required check.
# This branch's copy proves one thing: a real dispatched job lands on a runner-up KVM place,
# bootstraps the guest (scripts/guest_bootstrap.sh: build-essential, pinned rustup), checks out,
# runs one bounded step (cargo test -p forge-warden-core), exits and is cleaned up. main's sharded
# mutation jobs are left out here on purpose; RUNNER-UP v7.2's real rebase reconciles them.
name: mutation-baseline

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-baseline
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  route:
    timeout-minutes: 5
    name: route (runner-up for merged main only)
    # WP-RUNNER-UP: the only place the pool is chosen. Exact (case-sensitive) bash comparisons.
    # PROOF BRANCH ONLY: the default below is the pool, so this branch's dispatch routes there.
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PROTECTED: ${{ github.ref_protected }}
        run: |
          # PROOF BRANCH ONLY (never merged): route this one dispatch to the pool.
          runner=runner-up-kinoite
          case "$EVENT" in
            push|schedule|workflow_dispatch)
              if [ "$REF" = refs/heads/main ] && [ "$PROTECTED" = true ]; then
                runner=runner-up-kinoite
              fi
              ;;
          esac
          printf 'runner=%s\n' "$runner" >> "$GITHUB_OUTPUT"
          printf 'route: event=%s ref=%s protected=%s -> %s\n' "$EVENT" "$REF" "$PROTECTED" "$runner"

  full-workspace:
    timeout-minutes: 45
    name: runner-up live proof (bounded core tests)
    needs: route
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.route.outputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare a self-hosted runner-up guest (hosted images ship these tools)
        if: runner.environment == 'self-hosted'
        run: bash scripts/guest_bootstrap.sh
      - name: Refuse to count a hosted fallback as the proof
        env:
          ENVIRONMENT: ${{ runner.environment }}
          ROUTED: ${{ needs.route.outputs.runner }}
        run: |
          printf 'proof: runner_name=%s environment=%s routed=%s head=%s\n' \
            "$RUNNER_NAME" "$ENVIRONMENT" "$ROUTED" "$(git rev-parse HEAD)"
          test "$ENVIRONMENT" = self-hosted
          test "$ROUTED" = runner-up-kinoite
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - run: cargo fetch --locked
      - name: One bounded step (core crate tests only; a full mutation run would take hours here)
        timeout-minutes: 30
        run: cargo test --locked -p forge-warden-core
