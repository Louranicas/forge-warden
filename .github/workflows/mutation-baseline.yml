# Periodic audit only: not a required pull-request check.
name: mutation-baseline

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-baseline
  cancel-in-progress: false

jobs:
  full-workspace:
    name: full workspace mutation baseline
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-mutants@27.1.0
      - run: python3 -I scripts/tool_versions.py --check
      - run: cargo fetch --locked
      - name: Record the exact subject and tool versions
        run: |
          git rev-parse HEAD > mutation-provenance.txt
          rustc --version >> mutation-provenance.txt
          cargo mutants --version >> mutation-provenance.txt
          cat scripts/tool-versions.toml >> mutation-provenance.txt
      - name: Mutate the full workspace; any missed mutant fails the job
        run: env -u CARGO_TARGET_DIR cargo mutants --no-config --cap-lints true --workspace --no-shuffle --cargo-arg=--locked -vV
      - name: Preserve outcomes even when mutants survive
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-baseline-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            mutants.out
            mutation-provenance.txt
          if-no-files-found: error
          retention-days: 30
