# Supply-chain policy (cargo-deny). CI job `supply-chain` runs `cargo deny check` on every PR.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
# Only licences the tree actually uses: an unused allowance is a door nobody is watching.
# cargo-deny warns when one becomes unused; remove it then, and add one only in a reviewed diff.
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "Zlib",
]
unused-allowed-license = "deny"
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The core must stay small and pure; these crates bring I/O, async or a network into it.
deny = [
  { name = "tokio" },
  { name = "reqwest" },
  { name = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
