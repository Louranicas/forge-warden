# Supply-chain policy (cargo-deny). CI job `supply-chain` runs `cargo deny check` on every PR.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The core must stay small and pure; these crates bring I/O, async or a network into it.
deny = [
  { name = "tokio" },
  { name = "reqwest" },
  { name = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
